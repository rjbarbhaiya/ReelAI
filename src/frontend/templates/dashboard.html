<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Travel Map</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .user-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .user-dropdown {
            position: relative;
            display: inline-block;
        }

        .user-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .user-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background: white;
            min-width: 300px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            border-radius: 8px;
            z-index: 1;
            margin-top: 8px;
        }

        .dropdown-content.show {
            display: block;
        }

        .dropdown-header {
            padding: 16px;
            border-bottom: 1px solid #e5e7eb;
            background: #f9fafb;
            border-radius: 8px 8px 0 0;
        }

        .dropdown-item {
            padding: 12px 16px;
            border-bottom: 1px solid #f3f4f6;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .dropdown-item:hover {
            background-color: #f9fafb;
        }

        .dropdown-item:last-child {
            border-bottom: none;
            border-radius: 0 0 8px 8px;
        }

        .logout-btn {
            color: #ef4444;
            font-weight: 500;
        }

        .logout-btn:hover {
            background-color: #fef2f2;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input[type="url"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            background: #f9f9f9;
        }

        input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            margin-top: 20px;
            color: #667eea;
            font-weight: 500;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #e74c3c;
            margin-top: 10px;
            padding: 10px;
            background: #ffeaea;
            border-radius: 5px;
            border-left: 4px solid #e74c3c;
            display: none;
        }

        .example {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 4px solid #667eea;
        }

        .example-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .example-url {
            font-family: monospace;
            background: white;
            padding: 8px;
            border-radius: 4px;
            color: #667eea;
            font-size: 14px;
        }

        .trip-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }

        .trip-info {
            flex: 1;
            text-align: left;
        }

        .trip-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 2px;
        }

        .trip-meta {
            font-size: 12px;
            color: #666;
        }

        .trip-count {
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        /* Mobile responsiveness */
        @media (max-width: 600px) {
            .user-container {
                top: 15px;
                right: 15px;
            }
            
            .user-btn {
                padding: 10px 20px;
                font-size: 13px;
            }
            
            .dropdown-content {
                min-width: 250px;
                right: -50px;
            }
            
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <!-- User Dropdown -->
    <div class="user-container">
        <div class="user-dropdown">
            <button class="user-btn" onclick="toggleDropdown()" id="userBtn">
                <i class="fas fa-user"></i>
                <span id="userName">{{ user.username }}</span>
                <i class="fas fa-chevron-down" id="dropdownIcon"></i>
            </button>
            <div class="dropdown-content" id="dropdownContent">
                <div class="dropdown-header">
                    <div class="font-semibold text-gray-900">{{ user.username }}</div>
                    <div class="text-sm text-gray-500">{{ user.email }}</div>
                </div>
                <div id="tripsList">
                    <!-- Trips will be loaded here -->
                </div>
                <div class="dropdown-item logout-btn" onclick="logout()">
                    <i class="fas fa-sign-out-alt mr-2"></i>
                    Sign Out
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>🗺️ Travel Map</h1>
        <p class="subtitle">Welcome back, {{ user.username }}! Generate an interactive map from your travel video</p>
        
        <form id="urlForm">
            <div class="form-group">
                <label for="videoUrl">Video URL:</label>
                <input 
                    type="url" 
                    id="videoUrl" 
                    name="videoUrl" 
                    placeholder="https://example.com/your-video.mp4"
                    required
                >
            </div>
            
            <button type="submit" class="btn" id="submitBtn">
                Generate Map
            </button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                Processing your video...
            </div>
            
            <div class="error" id="error"></div>
        </form>

        <div class="example">
            <div class="example-title">Example URL format:</div>
            <div class="example-url">https://your-site.com/video.mp4</div>
        </div>
    </div>

    <script>
        // Toggle dropdown
        function toggleDropdown() {
            const dropdown = document.getElementById('dropdownContent');
            const icon = document.getElementById('dropdownIcon');
            
            if (dropdown.classList.contains('show')) {
                dropdown.classList.remove('show');
                icon.classList.remove('fa-chevron-up');
                icon.classList.add('fa-chevron-down');
            } else {
                dropdown.classList.add('show');
                icon.classList.remove('fa-chevron-down');
                icon.classList.add('fa-chevron-up');
                loadUserTrips();
            }
        }

        // Close dropdown when clicking outside
        window.onclick = function(event) {
            if (!event.target.matches('.user-btn') && !event.target.closest('.user-dropdown')) {
                const dropdown = document.getElementById('dropdownContent');
                const icon = document.getElementById('dropdownIcon');
                dropdown.classList.remove('show');
                icon.classList.remove('fa-chevron-up');
                icon.classList.add('fa-chevron-down');
            }
        }

        // Load user trips
        async function loadUserTrips() {
            try {
                const response = await fetch('/api/user/trips');
                const data = await response.json();
                
                const tripsList = document.getElementById('tripsList');
                
                if (data.success && data.trips.length > 0) {
                    tripsList.innerHTML = '';
                    data.trips.forEach(trip => {
                        const tripItem = document.createElement('div');
                        tripItem.className = 'dropdown-item';
                        tripItem.innerHTML = `
                            <div class="trip-item">
                                <div class="trip-info">
                                    <div class="trip-name">${trip.name}</div>
                                    <div class="trip-meta">${new Date(trip.created_at).toLocaleDateString()}</div>
                                </div>
                                <span class="trip-count">${trip.reels_count} reels</span>
                            </div>
                        `;
                        tripItem.onclick = () => viewTrip(trip.id);
                        tripsList.appendChild(tripItem);
                    });
                } else {
                    tripsList.innerHTML = '<div class="dropdown-item text-gray-500 text-center">No trips yet</div>';
                }
            } catch (error) {
                console.error('Error loading trips:', error);
                document.getElementById('tripsList').innerHTML = '<div class="dropdown-item text-red-500 text-center">Error loading trips</div>';
            }
        }

        // View trip function (placeholder)
        function viewTrip(tripId) {
            // Navigate to trip view
            window.location.href = `/trip/${tripId}`;
        }

        // Logout function
        function logout() {
            window.location.href = '/logout';
        }

        // Form submission
        document.getElementById('urlForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const form = e.target;
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const videoUrl = document.getElementById('videoUrl').value;
            
            // Reset UI
            error.style.display = 'none';
            loading.style.display = 'block';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            
            try {
                const response = await fetch('/process', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url: videoUrl })
                });
                
                if (response.ok) {
                    // Redirect to map page
                    window.location.href = '/map';
                } else {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to process video');
                }
            } catch (err) {
                error.textContent = err.message;
                error.style.display = 'block';
                loading.style.display = 'none';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Generate Map';
            }
        });
    </script>
</body>
</html>
